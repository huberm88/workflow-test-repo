name: Generate Random String

on: [push]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Run JavaScript to generate random string
        run: |
          node generateRandomString.js
          ls -l randomString.json  # Verify the file is created

      - name: Save random string as artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-string
          path: randomString.json

  compare:
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: extract_branch
        run: |
          ref=${GITHUB_REF}
          echo "Full ref: $ref"
          branch_name=${ref#refs/heads/}
          echo "Branch name: $branch_name"
          echo "::set-output name=branch_name::$branch_name"

      - name: Check previous run status
        run: |
          branch_name=${{ steps.extract_branch.outputs.branch_name }}
          echo "Checking previous run status for branch: $branch_name"
          api_response=$(curl -s \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/repos/huberm88/workflow-test-repo/actions/runs?branch=$branch_name&status=success)
          
          
          previous_run_conclusion=$(echo $api_response | jq -r '.workflow_runs[0].conclusion')
          echo "Previous run conclusion: $previous_run_conclusion"
          
          if [ "$previous_run_conclusion" == "success" ]; then
            echo "Previous workflow run was successful."
          else
            echo "No previous successful runs found."
            exit 0
          fi

      - name: Download previous random string
        run: |
          branch_name=${{ steps.extract_branch.outputs.branch_name }}
          echo "Fetching previous run artifacts for branch: $branch_name"
          api_response=$(curl -s \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/repos/huberm88/workflow-test-repo/actions/runs?branch=$branch_name&status=success)
          
          
          previous_artifacts_url=$(echo $api_response | jq -r '.workflow_runs[0].artifacts_url')
          
          if [ -z "$previous_artifacts_url" ]; then
            echo "No previous successful runs found."
            exit 0
          else
            echo "Previous artifacts URL: $previous_artifacts_url"
            artifacts_response=$(curl -s \
              -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              $previous_artifacts_url)
              
            echo "Artifacts response: $artifacts_response"
            download_url=$(echo $artifacts_response | jq -r '.artifacts[0].archive_download_url')
            
            if [ -z "$download_url" ]; then
              echo "No artifacts found in the previous run."
              exit 0
            else
              echo "Artifact download URL: $download_url"
              curl -L -o previous-artifacts.zip -H "Authorization: token ${{ secrets.GH_TOKEN }}" $download_url
              
              echo "Extracting previous artifacts..."
              unzip previous-artifacts.zip -d previous-random-string/
            fi
          fi

      - name: Verify previous random string file
        run: |
          echo "Contents of previous-random-string directory:"
          ls -l previous-random-string

      - name: Download current random string artifact
        uses: actions/download-artifact@v4
        with:
          name: random-string
          path: ./current

      - name: Verify current random string file
        run: |
          echo "Contents of current directory:"
          ls -l ./current

      - name: Compare random strings
        run: |
          echo "Comparing random strings..."
          diff_output=$(diff -u ./current/randomString.json previous-random-string/randomString.json || true)
          if [ -z "$diff_output" ]; then
            echo "No differences found."
          else
            echo "Differences found:"
            echo "$diff_output"
          fi
