name: Generate Random String

on: [push]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Run JavaScript to generate random string
        run: |
          node generateRandomString.js
          ls -l randomString.json  # Verify the file is created

      - name: Save random string as artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-string
          path: randomString.json

  compare:
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh auth login --with-token <<< "${GH_TOKEN}"

      - name: Check previous run status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Checking previous run status for ref: $GITHUB_REF and workflow: ${{ github.workflow }}"
          previous_run_conclusion=$(gh run list --branch $GITHUB_REF --workflow "${{ github.workflow }}" --json conclusion,status --jq '[.[] | select(.status == "completed")] | .[0].conclusion')
          echo "Previous run conclusion: $previous_run_conclusion"
          
          if [ "$previous_run_conclusion" == "success" ]; then
            echo "Previous workflow run was successful."
          elif [ "$previous_run_conclusion" == "failure" ]; then
            echo "Previous workflow run failed."
          else
            echo "No previous completed runs found or conclusion is null."
            exit 0
          fi

      - name: Download previous random string
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Fetching previous run artifacts for ref: $GITHUB_REF and workflow: ${{ github.workflow }}"
          previous_artifacts_url=$(gh run list --branch $GITHUB_REF --workflow "${{ github.workflow }}" --json artifacts_url,status --jq '[.[] | select(.status == "completed")] | .[0].artifacts_url')
          
          if [ -z "$previous_artifacts_url" ]; then
            echo "No previous successful runs found."
            exit 0
          else
            echo "Previous artifacts URL: $previous_artifacts_url"
            gh run download $(gh run list --branch $GITHUB_REF --workflow "${{ github.workflow }}" --json databaseId,status --jq '[.[] | select(.status == "completed")] | .[0].databaseId') --dir previous-random-string
          fi

      - name: Verify previous random string file
        run: |
          echo "Contents of previous-random-string directory:"
          ls -l previous-random-string

      - name: Download current random string artifact
        uses: actions/download-artifact@v4
        with:
          name: random-string
          path: ./current

      - name: Verify current random string file
        run: |
          echo "Contents of current directory:"
          ls -l ./current

      - name: Compare random strings
        run: |
          echo "Comparing random strings..."
          diff_output=$(diff -u ./current/randomString.json previous-random-string/randomString.json || true)
          if [ -z "$diff_output" ]; then
            echo "No differences found."
          else
            echo "Differences found:"
            echo "$diff_output"
          fi
