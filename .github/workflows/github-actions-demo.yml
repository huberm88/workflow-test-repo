name: Generate Random String

on: [push]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run JavaScript to generate random string
        run: node generateRandomString.js

      - name: Save random string as artifact
        uses: actions/upload-artifact@v2
        with:
          name: random-string
          path: randomString.json

  compare:
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download previous random string
        run: |
          echo "Fetching previous run artifacts..."
          curl -s \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/repos/<owner>/<repo>/actions/runs?branch=main&status=success \
            | jq -r '.workflow_runs[1].artifacts_url' \
            | xargs curl -s \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -o previous-artifacts.zip
          
          echo "Extracting previous artifacts..."
          unzip previous-artifacts.zip -d previous-random-string/

      - name: Compare random strings
        run: |
          echo "Comparing random strings..."
          diff randomString.json previous-random-string/randomString.json
